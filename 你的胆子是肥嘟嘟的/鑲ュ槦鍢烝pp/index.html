<!DOCTYPE html>

<style>

  #infoBar {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;

  .statBox {

  body.dark .statBox { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); box-shadow: none; }
  .statBox.pulse { transform: scale(1.12); border-color: #ff8f00; }
  .statBox .label { color: #a07a20; font-size: .68rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
  body.dark .statBox .label { color: #c9b070; }

  /* 进度条 */
  .progressWrap {

  /* 关卡背景图 */

  /* ===== 启动页 ===== */

<body>
  <!-- 启动页 -->
  <div id="splash">
    <img class="spLogo" src="assets/icon_light.png" alt="logo">
    <h1>你的胆子是<br>肥嘟嘟的</h1>
    <div class="sub">萌系三消 · 消到胆子肥嘟嘟</div>
    <div class="loading">加载中...
      <div class="bar"><i id="spBar"></i></div>
    </div>
  </div>

  <div class="header">
    <img class="appLogo" src="assets/icon_light.png" alt="logo">
    <div class="levelBadge" id="levelBadge">第 1 关</div>
    <h1>你的胆子是<br>肥嘟嘟的</h1>
    <div class="subtitle">萌系三消 · 消到胆子肥嘟嘟</div>
  </div>

  <div class="diffBar">
    <button class="diffBtn" data-diff="easy" onclick="setDifficulty('easy')"><span>🌱 简单</span><span class="desc">更多步数 · 低目标</span></button>
    <button class="diffBtn active" data-diff="normal" onclick="setDifficulty('normal')"><span>⚡ 中等</span><span class="desc">标准体验</span></button>
    <button class="diffBtn" data-diff="hard" onclick="setDifficulty('hard')"><span>🔥 困难</span><span class="desc">步数紧张 · 高目标</span></button>

  <div id="infoBar">
    <div class="statBox" id="sb-score"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="statBox" id="sb-best"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <div class="statBox" id="sb-moves"><div class="label">步数</div><div class="value" id="moves">30</div></div>
    <div class="statBox" id="sb-goal"><div class="label">目标</div><div class="value" id="goal">1500</div></div>
  </div>

  <div class="progressWrap"><div class="progressBar" id="progressBar"></div></div>

  <div id="boardWrap">
    <div id="bgLayer"></div>
    <canvas id="board"></canvas>
    <div id="comboTip"></div>
    <div id="msg">
      <img class="mascot" src="assets/em_happy.png" alt="mascot" id="msgMascot">
      <div class="big">游戏结束</div>
      <div class="small" id="msgDetail"></div>
      <div class="starRow" id="starRow"></div>
      <button class="btn" onclick="nextAction()" id="msgBtn">再玩一次</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tBtn" onclick="restart()">🔄 重玩本关</button>
    <button class="tBtn" onclick="showHint()">💡 提示</button>
    <button class="tBtn" id="themeBtn" onclick="cycleTheme()">🌗 主题</button>
    <button class="tBtn" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>

  <div id="hint">点击/滑动交换相邻宝石，三连及以上消除 · 4连产生特殊宝石 · 连消倍率叠加</div>
  <footer>你的胆子是肥嘟嘟的 · 网页 App · 可安装到桌面 🔊</footer>

<script>
'use strict';
/* ============ 安全存储（兼容无localStorage环境） ============ */
const Store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
/* ============ 配置 ============ */
const COLS = 8, ROWS = 8, CELL = 62;
const W = COLS * CELL, H = ROWS * CELL;
// 6种颜色对应6个表情包（按颜色索引映射）
const COLORS = ['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ff9100'];
const EMOJI_BY_COLOR = ['em_wow.png','em_laugh.png','em_victory.png','em_comeon.png','em_shy.png','em_cute.png'];
let USE_EMOJI = false; // 是否用表情包替代几何图形（资源加载成功后启用）
const SP = { NONE: 0, ROW: 1, COL: 2, BOMB: 3 }; // 特殊宝石类型
const SP_COLORS = { 1: 'rgba(255,255,255,.9)', 2: 'rgba(255,255,255,.9)', 3: 'rgba(255,200,50,.95)' };
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

/* ============ 难度配置 ============ */
const DIFFICULTIES = {
  easy: {
    name: '🌱 简单',
    movesMul: 1.5,    // 步数 x1.5
    goalMul: 0.7,     // 目标 x0.7
    colors: 4,        // 4种颜色
    label: '简单'
  },
  normal: {
    name: '⚡ 中等',
    movesMul: 1.0,    // 标准
    goalMul: 1.0,     // 标准
    colors: 5,        // 5种颜色
    label: '中等'
  },
  hard: {
    name: '🔥 困难',
    movesMul: 0.7,    // 步数 x0.7
    goalMul: 1.5,     // 目标 x1.5
    colors: 6,        // 6种颜色
    label: '困难'
  }
};
let difficulty = 'normal';

/* ============ 关卡配置（标准值，会根据难度缩放） ============ */
const LEVELS = [
  { moves: 30, goal: 1500 },
  { moves: 28, goal: 3000 },
  { moves: 26, goal: 5000 },
  { moves: 24, goal: 7500 },
  { moves: 22, goal: 10000 },
];
let levelIdx = 0;

function getLevelConfig(idx) {
  const cfg = LEVELS[Math.min(idx, LEVELS.length - 1)];
  const diff = DIFFICULTIES[difficulty];
  return {
    moves: Math.round(cfg.moves * diff.movesMul),
    goal: Math.round(cfg.goal * diff.goalMul),
    colors: diff.colors
  };
}

/* ============ 状态 ============ */
let grid, score, moves, goal, best, busy, gameOver, numColors;
let sel = null;
let swapAnim = null;   // {a,b,t,dur,back}
let popAnims = [];     // 消除动画
let floatTexts = [];   // 飘字
let particles = [];    // 粒子
let hintCells = null;  // 提示高亮
let hintTimer = null;
let lastInteract = 0;
let comboMax = 0;

/* ============ 音效系统 ============ */
let audioCtx = null;
let muted = false;
let masterGain = null;

function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!masterGain) {
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(audioCtx.destination);
  }
  return audioCtx;
}



// 通用音效生成器
/* ---------- 基础音色 ---------- */
// 柔和衰减包络
function playTone(freq, dur, type = 'sine', vol = 0.25, slideFreq = null, attack = 0.008) {
  if (muted) return;
  const ctx = getAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + dur);
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + attack);
  gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + dur);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + dur);
}

// 带泛音的温暖音色（模拟电钢琴/钟声）
function playBell(freq, dur, vol = 0.22) {
  if (muted) return;
  const ctx = getAudio();
  if (!ctx) return;
  const harmonics = [1, 2, 3, 4, 6];
  const amps = [1, 0.4, 0.2, 0.1, 0.06];
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = Math.min(freq * 12, 12000);
  filter.Q.value = 0.7;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0005, ctx.currentTime + dur);
  filter.connect(gain);
  gain.connect(masterGain);
  harmonics.forEach((h, i) => {
    const osc = ctx.createOscillator();
    osc.type = i === 0 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(freq * h, ctx.currentTime);
    const og = ctx.createGain();
    og.gain.setValueAtTime(amps[i] / harmonics.length, ctx.currentTime);
    osc.connect(og);
    og.connect(filter);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur);
  });
}

// 柔和噪声（爆炸/魔法音效）
function playNoise(dur, vol = 0.15, freq = 800, q = 1) {
  if (muted) return;
  const ctx = getAudio();
  if (!ctx) return;
  const len = ctx.sampleRate * dur;
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(freq * 2, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + dur);
  filter.Q.value = q;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start(ctx.currentTime);
}

function sfxPop(combo = 1) {
  // 五声音阶索引表（C大调）：C D E G A
  const scale = [0, 2, 4, 7, 9];
  const baseNote = 3 + Math.min(combo - 1, 16); // 从 E4 起
  const octave = Math.floor(baseNote / 5);
  const degree = baseNote % 5;
  const semi = scale[degree] + octave * 12;
  const freq = 261.63 * Math.pow(2, semi / 12); // C4 = 261.63
  playBell(freq, 0.28, 0.18);
  // 加一个八度泛音，更闪亮
  playTone(freq * 2, 0.12, 'sine', 0.05, freq * 2.4, 0.004);

// 连消提示音：快速上行琶音（C大调五声）

  const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 23, 24];
  const start = Math.min(combo - 2, 7); // 连消越高，起始音越高
  const count = Math.min(3 + Math.floor((combo - 1) / 3), 5);
  for (let i = 0; i < count; i++) {
    const semi = scale[Math.min(start + i, scale.length - 1)];
    const f = 261.63 * Math.pow(2, semi / 12);
    setTimeout(() => playBell(f, 0.22, 0.16), i * 55);
  }
}

best = +Store.get('match3_best_' + difficulty) || 0;
const unlocked = Math.min(LEVELS.length, (+Store.get('match3_unlocked') || 1));

/* ============ 工具函数 ============ */
const rand = n => Math.floor(Math.random() * n);
function newGem(r, c, color) {
  return { r, c, color: color != null ? color : rand(numColors), sp: SP.NONE, y: -CELL * (rand(3) + 1), alpha: 1, scale: 1 };
}
function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

/* 找出所有匹配，返回 {cells:Set, lines:[]} */
function findMatches(g) {
  const lines = [];
  // 水平
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS - 2) {
      const cl = g[r][c] && g[r][c].color;
      if (cl == null) { c++; continue; }
      let len = 1;
      while (c + len < COLS && g[r][c + len] && g[r][c + len].color === cl) len++;
      if (len >= 3) lines.push({ dir: 'h', r, c, len, color: cl });
      c += len;
    }
  }
  // 垂直
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS - 2) {
      const cl = g[r][c] && g[r][c].color;
      if (cl == null) { r++; continue; }
      let len = 1;
      while (r + len < ROWS && g[r + len][c] && g[r + len][c].color === cl) len++;
      if (len >= 3) lines.push({ dir: 'v', r, c, len, color: cl });
      r += len;
    }
  }
  const cells = new Set();
  lines.forEach(l => {
    for (let i = 0; i < l.len; i++) {
      const rr = l.dir === 'h' ? l.r : l.r + i;
      const cc = l.dir === 'h' ? l.c + i : l.c;
      cells.add(rr + ',' + cc);
    }
  });
  return { cells, lines };
}

function hasAnyMove(g) {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (!g[r][c]) continue;
      const swaps = [[r, c + 1], [r + 1, c]];
      for (const [nr, nc] of swaps) {
        if (!inBounds(nr, nc) || !g[nr][nc]) continue;
        [g[r][c], g[nr][nc]] = [g[nr][nc], g[r][c]];
        const ok = findMatches(g).cells.size > 0;
        [g[r][c], g[nr][nc]] = [g[nr][nc], g[r][c]];
        if (ok) return true;
      }
    }
  return false;
}

function reshuffle() {
  let flat = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) flat.push(grid[r][c].color);
  let guard = 0;
  do {
    for (let i = flat.length - 1; i > 0 && guard < 200; i--, guard++) {
      const j = rand(i + 1); [flat[i], flat[j]] = [flat[j], flat[i]];
    }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c].color = flat[r * COLS + c];
  } while ((findMatches(grid).cells.size > 0 || !hasAnyMove(grid)) && guard < 200);
  sfxShuffle();
  floatTexts.push({ text: '🔀 洗牌！', x: W / 2, y: H / 2, t: 0, dur: 50, size: 28, color: '#ffd54f' });
}

/* ============ 特殊宝石逻辑 ============ */
function activateSpecial(gem, srcR, srcC) {
  const list = [];
  if (gem.sp === SP.ROW) {
    for (let c = 0; c < COLS; c++) if (grid[srcR][c] && !(srcR === srcC && false)) list.push({ r: srcR, c });
  } else if (gem.sp === SP.COL) {
    for (let r = 0; r < ROWS; r++) list.push({ r, c: srcC });
  } else if (gem.sp === SP.BOMB) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = srcR + dr, nc = srcC + dc;
      if (inBounds(nr, nc) && grid[nr][nc]) list.push({ r: nr, c: nc });
    }
  }
  return list;
}

/* ============ 核心流程 ============ */
function initGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) grid[r][c] = newGem(r, c);
  }
  let guard = 0;
  while (findMatches(grid).cells.size > 0 && guard < 100) {
    for (const cell of findMatches(grid).cells) {
      const [r, c] = cell.split(',').map(Number);
      grid[r][c].color = rand(numColors);
    }
    guard++;
  }
  if (!hasAnyMove(grid)) reshuffle();
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) {
        if (writeRow !== r) {
          grid[writeRow][c] = grid[r][c];
          grid[r][c] = null;
        }
        writeRow--;
      }
    }
    for (let r = writeRow; r >= 0; r--) grid[r][c] = newGem(r, c);
  }
}

function spawnSpecials(lines, combo) {
  // 在4连/5连的位置生成特殊宝石
  for (const l of lines) {
    if (l.len >= 5) {
      const rr = l.dir === 'h' ? l.r : l.r + Math.floor(l.len / 2);
      const cc = l.dir === 'h' ? l.c + Math.floor(l.len / 2) : l.c;
      grid[rr][cc] = { r: rr, c: cc, color: l.color, sp: SP.BOMB, y: rr * CELL, alpha: 1, scale: 1 };
    } else if (l.len === 4) {
      const rr = l.dir === 'h' ? l.r : l.r + 1;
      const cc = l.dir === 'h' ? l.c + 1 : l.c;
      grid[rr][cc] = { r: rr, c: cc, color: l.color, sp: l.dir === 'h' ? SP.ROW : SP.COL, y: rr * CELL, alpha: 1, scale: 1 };
    }
  }
}

async function resolveCascades(combo) {
  let currentCombo = combo;
  let firstMatch = true;
  while (true) {
    let { cells, lines } = findMatches(grid);
    if (cells.size === 0) break;

    if (currentCombo > 1) {
      showCombo(currentCombo);
      sfxCascade(currentCombo);
    }

    // 计分 + 生成特殊宝石（只在第一轮）
    const baseGain = cells.size * 10 * currentCombo;
    addScore(baseGain);
    if (firstMatch) {
      const hasSpecial = lines.some(l => l.len >= 4);
      spawnSpecials(lines, currentCombo);
      if (hasSpecial) sfxSpecialCreate();
    }
    firstMatch = false;

    // 收集要消除的宝石（含特殊触发）
    const toPop = new Set(cells);
    const queue = [];
    for (const cell of cells) {
      const [r, c] = cell.split(',').map(Number);
      const gem = grid[r][c];
      if (gem.sp !== SP.NONE) queue.push({ gem, r, c });
    }
    while (queue.length) {
      const { gem, r, c } = queue.shift();
      if (gem.sp === SP.BOMB) sfxBomb();
      else if (gem.sp === SP.ROW || gem.sp === SP.COL) sfxRowClear();
      const activated = activateSpecial(gem, r, c);
      for (const a of activated) {
        const key = a.r + ',' + a.c;
        if (!toPop.has(key)) {
          toPop.add(key);
          const g2 = grid[a.r][a.c];
          if (g2 && g2.sp !== SP.NONE) queue.push({ gem: g2, r: a.r, c: a.c });
        }
      }
    }

    // 飘字
    for (const cell of toPop) {
      const [r, c] = cell.split(',').map(Number);
      const g = grid[r][c];
      if (!g) continue;
      const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
      floatTexts.push({ text: '+' + (10 * currentCombo), x, y, t: 0, dur: 40, size: 15, color: '#fff' });
      // 粒子
      for (let p = 0; p < 5; p++) {
        particles.push({
          x, y, vx: (rand(200) - 100) / 10, vy: (rand(200) - 100) / 10 - 1,
          life: rand(20) + 15, maxLife: 35, color: COLORS[g.color], size: rand(4) + 2
        });
      }
      sfxPop(currentCombo);
    }

    // 标记消除动画
    for (const cell of toPop) {
      const [r, c] = cell.split(',').map(Number);
      const g = grid[r][c];
      if (g) popAnims.push({ gem: g, x: c * CELL + CELL / 2, y: r * CELL + CELL / 2, t: 0, dur: 22 });
      grid[r][c] = null;
    }

    await wait(280);
    applyGravity();
    currentCombo++;

    if (score >= goal && !gameOver) { win(); return; }
  }

  comboMax = Math.max(comboMax, currentCombo - 1);

  // 检查死局
  if (!hasAnyMove(grid)) reshuffle();

  busy = false;
  checkEnd();
}

/* ============ 交互 ============ */
function getCell(ev) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
  const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
  return { c: Math.floor(cx * scaleX / CELL), r: Math.floor(cy * scaleY / CELL) };
}

let touchStart = null;
function onTouchStart(ev) {
  if (busy || gameOver) return;
  ev.preventDefault();
  const pos = getCell(ev);
  touchStart = { ...pos, x: ev.touches[0].clientX, y: ev.touches[0].clientY, time: Date.now() };
  lastInteract = Date.now();
  hideHint();
}
function onTouchMove(ev) {
  if (!touchStart || busy || gameOver) return;
  ev.preventDefault();
  const dx = ev.touches[0].clientX - touchStart.x;
  const dy = ev.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  let nr = touchStart.r, nc = touchStart.c;
  if (Math.abs(dx) > Math.abs(dy)) nc += dx > 0 ? 1 : -1;
  else nr += dy > 0 ? 1 : -1;
  if (inBounds(nr, nc) && inBounds(touchStart.r, touchStart.c)) {
    trySwap({ r: touchStart.r, c: touchStart.c }, { r: nr, c: nc });
    touchStart = null;
    sel = null;
  }
}
function onTouchEnd(ev) {
  if (touchStart && !busy && !gameOver) {
    const dt = Date.now() - touchStart.time;
    if (dt < 300) onClickPos(touchStart);
  }
  touchStart = null;
}
function onClick(ev) {
  if (busy || gameOver) return;
  onClickPos(getCell(ev));
  hideHint();
}
function onClickPos({ r, c }) {
  if (!inBounds(r, c)) return;
  if (!sel) { sel = { r, c }; sfxSelect(); pulseStat('sb-score'); return; }
  const dr = Math.abs(sel.r - r), dc = Math.abs(sel.c - c);
  if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
    trySwap(sel, { r, c });
    sel = null;
  } else if (dr === 0 && dc === 0) { sel = null; }
  else sel = { r, c };
}

async function trySwap(a, b) {
  if (!inBounds(a.r, a.c) || !inBounds(b.r, b.c)) { busy = false; return; }
  if (!grid[a.r][a.c] || !grid[b.r][b.c]) { busy = false; return; }
  busy = true;
  moves--;
  pulseStat('sb-moves');
  sfxSwap();

  // 动画交换
  swapAnim = { a: { ...a }, b: { ...b }, t: 0, dur: 12, back: false };
  await wait(180);

  // 执行交换
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  grid[a.r][a.c] = gb; grid[b.r][b.c] = ga;
  gb.r = a.r; gb.c = a.c; ga.r = b.r; ga.c = b.c;
  swapAnim = null;

  const m = findMatches(grid);
  if (m.cells.size === 0) {
    // 无效交换，退回
    swapAnim = { a: { ...b }, b: { ...a }, t: 0, dur: 12, back: true };
    await wait(180);
    grid[a.r][a.c] = ga; grid[b.r][b.c] = gb;
    ga.r = a.r; ga.c = a.c; gb.r = b.r; gb.c = b.c;
    swapAnim = null;
    moves++; // 不消耗步数
    sfxSwapBack();
    busy = false;
  } else {
    await resolveCascades(1);
  }
}

/* ============ 渲染 ============ */
const GEM_SHAPES = ['circle', 'square', 'diamond', 'hexagon', 'star', 'triangle'];
function drawGem(g, x, y, size) {
  if (!g) return;
  const s = size * 0.40 * (g.scale || 1);
  ctx.save();
  ctx.globalAlpha = g.alpha != null ? g.alpha : 1;
  ctx.translate(x, y);

  // 特殊宝石用特殊高亮圈
  if (g.sp !== SP.NONE) {
    ctx.shadowColor = SP_COLORS[g.sp] || '#fff';
    ctx.shadowBlur = 16;
  }

  // 表情包贴图模式
  if (USE_EMOJI) {
    const key = EMOJI_IMGS[EMOJI_BY_COLOR[g.color % EMOJI_BY_COLOR.length]];
    if (key && key.complete && key.naturalWidth) {
      const w = s * 2;
      ctx.drawImage(key, -w / 2, -w / 2, w, w);
      ctx.restore();
      drawSpecialBadge(g, s);
      return;
    }
  }

  const col = COLORS[g.color % COLORS.length];
  // 阴影
  ctx.shadowColor = col;
  ctx.shadowBlur = g.sp !== SP.NONE ? 16 : 6;

  // 主体渐变
  const grd = ctx.createRadialGradient(-s * .3, -s * .35, s * .05, 0, 0, s);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(.2, col);
  grd.addColorStop(1, shade(col, -.4));
  ctx.fillStyle = grd;

  ctx.beginPath();
  const shape = GEM_SHAPES[g.color % GEM_SHAPES.length];
  switch (shape) {
    case 'circle': ctx.arc(0, 0, s, 0, Math.PI * 2); break;
    case 'square':
      roundRect(ctx, -s, -s, s * 2, s * 2, s * .25); break;
    case 'diamond':
      ctx.moveTo(0, -s * 1.2); ctx.lineTo(s * .9, 0); ctx.lineTo(0, s * 1.2); ctx.lineTo(-s * .9, 0); break;
    case 'hexagon':
      for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; i ? ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s) : ctx.moveTo(Math.cos(a) * s, Math.sin(a) * s); } break;
    case 'star':
      for (let i = 0; i < 10; i++) { const a = Math.PI / 5 * i - Math.PI / 2; const rr = i % 2 ? s * .48 : s; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } break;
    case 'triangle':
      for (let i = 0; i < 3; i++) { const a = Math.PI * 2 / 3 * i - Math.PI / 2; i ? ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s) : ctx.moveTo(Math.cos(a) * s, Math.sin(a) * s); } break;
  }
  ctx.closePath();
  ctx.fill();

  // 特殊宝石标记
  ctx.shadowBlur = 0;
  if (g.sp !== SP.NONE) {
    ctx.strokeStyle = SP_COLORS[g.sp] || '#fff';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, s * .72, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 图标
    ctx.fillStyle = SP_COLORS[g.sp] || '#fff';
    ctx.font = `${s * .7}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const icon = g.sp === SP.ROW ? '↔' : g.sp === SP.COL ? '↕' : '✸';
    ctx.fillText(icon, 0, 1);
    ctx.textBaseline = 'alphabetic';
  } else {
    // 普通高光
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.ellipse(-s * .28, -s * .32, s * .25, s * .16, -.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 特殊宝石额外标记（贴图模式下绘制在贴图之上）
function drawSpecialBadge(g, s) {
  if (g.sp === SP.NONE) return;
  ctx.save();
  ctx.shadowColor = SP_COLORS[g.sp] || '#fff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = SP_COLORS[g.sp] || '#fff';
  ctx.font = `bold ${s * .6}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const icon = g.sp === SP.ROW ? '↔' : g.sp === SP.COL ? '↕' : '✸';
  ctx.fillText(icon, s * .55, -s * .55);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
}

function shade(hex, amt) {
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + r * amt)); g = Math.max(0, Math.min(255, g + g * amt)); b = Math.max(0, Math.min(255, b + b * amt));
  return `rgb(${r|0},${g|0},${b|0})`;
}

function easeOutBack(t) { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeInOut(t) { return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function drawBoard() {
  ctx.clearRect(0, 0, W, H);

  // 棋盘格
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.06)';
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      // 内边框
      ctx.strokeStyle = 'rgba(255,255,255,.03)';
      ctx.lineWidth = 1;
      ctx.strokeRect(c * CELL + .5, r * CELL + .5, CELL - 1, CELL - 1);
    }

  // 交换动画偏移
  const swapOff = {};
  if (swapAnim) {
    swapAnim.t++;
    const p = easeInOut(Math.min(1, swapAnim.t / swapAnim.dur));
    const off = (p - 1) * CELL;
    const dr = swapAnim.b.r - swapAnim.a.r, dc = swapAnim.b.c - swapAnim.a.c;
    swapOff[swapAnim.a.r + ',' + swapAnim.a.c] = { dx: dc * off, dy: dr * off };
    swapOff[swapAnim.b.r + ',' + swapAnim.b.c] = { dx: -dc * off, dy: -dr * off };
  }

  // 宝石
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const g = grid[r][c];
      if (!g) continue;
      // 下落动画
      if (g.y < r * CELL) {
        const diff = r * CELL - g.y;
        g.y += Math.max(3, diff * .2);
        if (g.y > r * CELL) g.y = r * CELL;
      }
      const off = swapOff[r + ',' + c] || { dx: 0, dy: 0 };
      drawGem(g, c * CELL + CELL / 2 + off.dx, g.y + CELL / 2 + off.dy, CELL);
    }

  // 提示高亮
  if (hintCells) {
    const t = Date.now() / 300;
    const a = 0.3 + 0.2 * Math.sin(t);
    ctx.save();
    hintCells.forEach(cell => {
      const [r, c] = cell.split(',').map(Number);
      ctx.fillStyle = `rgba(255,213,79,${a})`;
      ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
    });
    ctx.restore();
  }

  // 选中框
  if (sel && inBounds(sel.r, sel.c)) {
    const t = Date.now() / 180;
    ctx.strokeStyle = `hsl(${(t * 80) % 360},100%,72%)`;
    ctx.lineWidth = 3;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 14;
    const pad = 3;
    roundRect(ctx, sel.c * CELL + pad, sel.r * CELL + pad, CELL - pad * 2, CELL - pad * 2, 8);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 消除动画
  popAnims = popAnims.filter(a => {
    a.t++;
    const p = a.t / a.dur;
    ctx.save();
    const rad = CELL * .35 * Math.min(p * 2.5, 1.3);
    ctx.globalAlpha = Math.max(0, 1 - p);
    ctx.strokeStyle = COLORS[a.gem.color % COLORS.length];
    ctx.lineWidth = 3 * (1 - p * .5);
    ctx.beginPath();
    ctx.arc(a.x, a.y, rad, 0, Math.PI * 2);
    ctx.stroke();
    // 内爆
    ctx.fillStyle = COLORS[a.gem.color % COLORS.length];
    ctx.globalAlpha = Math.max(0, 0.5 * (1 - p));
    ctx.beginPath();
    ctx.arc(a.x, a.y, rad * .5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return p < 1;
  });

  // 粒子
  particles = particles.filter(p => {
    p.life--;
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.3; // 重力
    p.vx *= 0.98;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return p.life > 0;
  });

  // 飘字
  floatTexts = floatTexts.filter(ft => {
    ft.t++;
    const p = ft.t / ft.dur;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p);
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${ft.size}px 'Segoe UI',sans-serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, ft.x, ft.y - p * 40);
    ctx.restore();
    return p < 1;
  });
}

/* ============ UI 更新 ============ */
function updateInfo() {
  document.getElementById('score').textContent = score;
  document.getElementById('moves').textContent = moves;
  document.getElementById('goal').textContent = goal;
  const bestEl = document.getElementById('best');
  const curBest = Math.max(best, score);
  bestEl.textContent = curBest;
  const goalEl = document.getElementById('goal');
  goalEl.className = score >= goal ? 'value goal-reached' : 'value';
  // 进度条
  const pct = Math.min(100, (score / goal) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
}

function pulseStat(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 250);
}

function showCombo(n) {
  const tip = document.getElementById('comboTip');
  const texts = ['', '', '连击 x2！', '连击 x3！', '连击 x4！', '连击 x5！', '🔥 超神连消！'];
  tip.textContent = texts[Math.min(n, texts.length - 1)] || `连击 x${n}！`;
  tip.classList.add('show');
  setTimeout(() => tip.classList.remove('show'), 600);
  // 加分飘字
  floatTexts.push({ text: `${texts[Math.min(n, texts.length - 1)] || `连击 x${n}`}  +${n * 20}`, x: W / 2, y: H / 2 - 20, t: 0, dur: 50, size: 22, color: '#ffd54f' });
}

function addScore(n) {
  // 动画递增
  const start = score;
  const end = score + n;
  score = end;
  pulseStat('sb-score');
}

/* ============ 提示系统 ============ */
function findHint() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const swaps = [[r, c + 1], [r + 1, c]];
      for (const [nr, nc] of swaps) {
        if (!inBounds(nr, nc)) continue;
        [grid[r][c], grid[nr][nc]] = [grid[nr][nc], grid[r][c]];
        const ok = findMatches(grid).cells.size > 0;
        [grid[r][c], grid[nr][nc]] = [grid[nr][nc], grid[r][c]];
        if (ok) return [[r, c], [nr, nc]];
      }
    }
  return null;
}
function showHint() {
  if (busy || gameOver) return;
  const hint = findHint();
  if (hint) {
    hintCells = hint.map(([r, c]) => r + ',' + c);
    sfxHint();
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(hideHint, 3500);
  }
}
function hideHint() { hintCells = null; if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; } }

/* ============ 控制 ============ */
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function loadLevel(idx) {
  const cfg = getLevelConfig(Math.min(idx, LEVELS.length - 1));
  levelIdx = idx;
  score = 0; moves = cfg.moves; goal = cfg.goal; numColors = cfg.colors;
  busy = false; gameOver = false; sel = null; swapAnim = null;
  popAnims = []; floatTexts = []; particles = []; comboMax = 0;
  document.getElementById('levelBadge').textContent = `第 ${idx + 1} 关 · ${DIFFICULTIES[difficulty].label}`;
  document.getElementById('msg').style.display = 'none';
  hideHint();
  applyLevelBackground(difficulty);
  initGrid();
}

/* 根据难度切换棋盘背景插画 */
function applyLevelBackground(diff) {
  const map = { easy: 'bg_easy.png', normal: 'bg_medium.png', hard: 'bg_hard.png' };
  const layer = document.getElementById('bgLayer');
  if (!layer) return;
  const url = 'assets/' + map[diff];
  layer.style.backgroundImage = `url('${url}')`;
}

function setDifficulty(diff) {
  difficulty = diff;
  // 更新按钮高亮
  document.querySelectorAll('.diffBtn').forEach(b => {
    b.classList.toggle('active', b.dataset.diff === diff);
  });
  // 切换难度时回到第1关重新开始
  loadLevel(0);
}

function restart() { loadLevel(levelIdx); }

function nextAction() {
  if (score >= goal && levelIdx < LEVELS.length - 1) {
    sfxLevelUp();
    loadLevel(levelIdx + 1);
  }
  else loadLevel(levelIdx);
}

function win() {
  if (gameOver) return;
  gameOver = true; busy = true;
  if (score > best) { best = score; Store.set('match3_best_' + difficulty, best); }
  sfxWin();
  // 解锁下一关
  const newUnlocked = Math.min(LEVELS.length, levelIdx + 2);
  if (newUnlocked > unlocked) Store.set('match3_unlocked', newUnlocked);

  // 星级评价
  const pct = score / goal;
  let stars = 1;
  if (pct >= 1.5) stars = 3;
  else if (pct >= 1.2) stars = 2;
  const starStr = '★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars);

  document.getElementById('msgDetail').innerHTML =
    `得分：<b style="color:#ff8f00">${score}</b><br>最高连消：<b style="color:#2e9c5f">x${comboMax}</b><br>剩余步数：<b style="color:#2b7fc0">${moves}</b>`;
  document.getElementById('starRow').textContent = starStr;
  document.getElementById('msgMascot').src = 'assets/em_victory.png';
  document.querySelector('#msg .big').textContent = '🎉 过关！';
  const btn = document.getElementById('msgBtn');
  btn.textContent = levelIdx < LEVELS.length - 1 ? '下一关 →' : '再玩一次';
  document.getElementById('msg').style.display = 'flex';
}

function lose() {
  if (gameOver) return;
  gameOver = true; busy = true;
  if (score > best) { best = score; Store.set('match3_best_' + difficulty, best); }
  sfxLose();
  document.getElementById('msgMascot').src = 'assets/em_wronged.png';
  document.getElementById('msgDetail').innerHTML =
    `得分 <b style="color:#ff5252">${score}</b> / 目标 <b>${goal}</b><br>最高连消：<b style="color:#2e9c5f">x${comboMax}</b>`;
  document.getElementById('starRow').textContent = '';
  document.querySelector('#msg .big').textContent = '💔 挑战失败';
  document.getElementById('msgBtn').textContent = '再试一次';
  document.getElementById('msg').style.display = 'flex';
}

function checkEnd() {
  if (gameOver) return;
  if (moves <= 0) { if (score >= goal) win(); else lose(); }
}

/* ============ 主循环 ============ */
function loop(ts) {
  updateInfo();
  drawBoard();
  requestAnimationFrame(loop);
}

/* ============ 事件绑定 ============ */
canvas.addEventListener('click', onClick);
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });

// 键盘操作
let keySel = null;
document.addEventListener('keydown', e => {
  if (gameOver) return;
  if (!keySel) { keySel = { r: 3, c: 3 }; return; }
  const map = { ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1] };
  if (map[e.key]) {
    e.preventDefault();
    const [dr, dc] = map[e.key];
    const nr = Math.max(0, Math.min(ROWS - 1, keySel.r + dr));
    const nc = Math.max(0, Math.min(COLS - 1, keySel.c + dc));
    if ((Math.abs(nr - keySel.r) + Math.abs(nc - keySel.c)) === 1) {
      trySwap(keySel, { r: nr, c: nc });
    }
    keySel = { r: nr, c: nc };
    sel = keySel;
  }
});

/* ============ 主题切换（跟随系统/手动） ============ */
function applyTheme(mode) {
  const dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark', dark);
  const logo = document.querySelector('.appLogo');
  const spLogo = document.querySelector('.spLogo');
  const logoUrl = dark ? 'assets/icon_dark.png' : 'assets/icon_light.png';
  if (logo) logo.src = logoUrl;
  if (spLogo) spLogo.src = logoUrl;
  const sp = document.getElementById('splash');
  if (sp) sp.classList.toggle('dark', dark);
  const tb = document.getElementById('themeBtn');
  if (tb) tb.textContent = mode === 'dark' ? '🌙 深色' : mode === 'light' ? '☀️ 浅色' : '🌗 跟随';
}
const THEME_ORDER = ['auto', 'light', 'dark'];
function cycleTheme() {
  let i = THEME_ORDER.indexOf(themeMode);
  themeMode = THEME_ORDER[(i + 1) % THEME_ORDER.length];
  Store.set('match3_theme', themeMode);
  applyTheme(themeMode);
}
let themeMode = Store.get('match3_theme') || 'auto';
applyTheme(themeMode);
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', () => { if (themeMode === 'auto') applyTheme('auto'); });
}

/* ============ 预加载图片资源 ============ */
const ASSET_FILES = [
  'bg_easy.png','bg_medium.png','bg_hard.png',
  'em_surprised.png','em_happy.png','em_speechless.png','em_shy.png',
  'em_laugh.png','em_cute.png','em_wow.png','em_wronged.png',
  'em_comeon.png','em_victory.png','em_lying.png','em_sleepy.png',
  'icon_light.png','icon_dark.png','promo.png'
];
const EMOJI_IMGS = {};
let loadedCount = 0;
function preloadAssets() {
  const bar = document.getElementById('spBar');
  const tasks = ASSET_FILES.map(name => new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loadedCount++;
      if (bar) bar.style.width = Math.round(loadedCount / ASSET_FILES.length * 100) + '%';
      resolve();
    };
    img.src = 'assets/' + name;
    EMOJI_IMGS[name] = img;
  }));
  return Promise.all(tasks);
}

function startApp() {
  USE_EMOJI = true;
  // 启动页淡出
  const sp = document.getElementById('splash');
  if (sp) {
    sp.classList.add('hide');
    setTimeout(() => sp.remove(), 700);
  }
  loadLevel(0);
}

/* ============ 启动 ============ */
muted = Store.get('match3_muted') === '1';
const muteBtn = document.getElementById('muteBtn');
if (muteBtn) muteBtn.textContent = muted ? '🔇' : '🔊';

preloadAssets().then(() => {
  // 资源就绪后启动，至少停留 1.2s 保证启动页体验
  const elapsed = Date.now() - _bootStart;
  setTimeout(startApp, Math.max(0, 1200 - elapsed));
});
const _bootStart = Date.now();

requestAnimationFrame(loop);

/* ============ PWA：注册 Service Worker 支持离线安装 ============ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      const CACHE = 'feidudu-v1';
      const ASSETS = ['./','index.html','manifest.webmanifest'];
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request).then(res => {
            const copy = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, copy));
            return res;
          }).catch(() => caches.match('./index.html')))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  });
}
